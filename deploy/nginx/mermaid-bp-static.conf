# Incluir dentro del bloque server que sirve Mermaid BP.
index index.html;
server_tokens off;
client_max_body_size 1k;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'self'; worker-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), display-capture=(), clipboard-read=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cache-Control "no-store" always;
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
location ~ (^|/)\. { return 404; }
location = /plugins/ {
    autoindex on;
    autoindex_format json;
}
location / {
    try_files $uri $uri/ =404;
}
