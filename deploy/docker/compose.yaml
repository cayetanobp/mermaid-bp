name: mermaid-bp
services:
  mermaid:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: mermaid-bp:production
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    environment:
      EMBED_ORIGIN: ${EMBED_ORIGIN:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
