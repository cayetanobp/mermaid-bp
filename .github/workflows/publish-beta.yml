name: Publicar beta
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: ID de la ejecución Windows cuyo instalador has revisado
        required: true
        type: string
      linux_build_run_id:
        description: ID de la ejecución Linux cuyo paquete Debian firmado has revisado
        required: true
        type: string
      confirmation:
        description: Escribe PUBLICAR para autorizar la release beta
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-beta-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar autorización, versiones y compilaciones
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          LINUX_BUILD_RUN_ID: ${{ inputs.linux_build_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:CONFIRMATION -cne 'PUBLICAR') { throw 'Falta la confirmación PUBLICAR.' }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publica solo desde main.' }
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'El ID de ejecución debe ser numérico.' }
          $corePackage = Get-Content package.json -Raw | ConvertFrom-Json
          $coreLock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $desktopPackage = Get-Content desktop-app/package.json -Raw | ConvertFrom-Json
          $tauriConfig = Get-Content desktop-app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoToml = Get-Content desktop-app/src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargoToml, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $version = $tauriConfig.version
          if ($corePackage.version -ne $version -or $coreLock.version -ne $version -or $coreLock['packages']['']['version'] -ne $version -or $desktopPackage.version -ne $version -or $cargoVersion -ne $version) {
            throw 'La versión debe coincidir en los metadatos web, npm, Tauri y Cargo.'
          }
          if ($tauriConfig.productName -ne 'Mermaid BP') { throw 'El nombre del producto debe ser Mermaid BP.' }
          if ($version -notmatch '-beta\.\d+$') { throw 'La publicación requiere una versión beta.' }
          $build = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo consultar la ejecución de compilación.' }
          if ($build.name -ne 'Aplicación de escritorio Windows' -or $build.conclusion -ne 'success' -or $build.head_branch -ne 'main' -or $build.head_sha -ne $env:GITHUB_SHA) {
            throw 'La compilación debe haber terminado correctamente sobre el HEAD actual de main.'
          }
          if ($env:LINUX_BUILD_RUN_ID -notmatch '^\d+$') { throw 'El ID de ejecución Linux debe ser numérico.' }
          $linuxBuild = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:LINUX_BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo consultar la ejecución Linux.' }
          if ($linuxBuild.name -ne 'Aplicación de escritorio Linux' -or $linuxBuild.conclusion -ne 'success' -or $linuxBuild.head_branch -ne 'main' -or $linuxBuild.head_sha -ne $env:GITHUB_SHA) {
            throw 'La compilación Linux debe haber terminado correctamente sobre el HEAD actual de main.'
          }
          $releaseJson = Join-Path $env:RUNNER_TEMP 'beta-releases.json'
          $tagsJson = Join-Path $env:RUNNER_TEMP 'beta-tags.json'
          $releaseOutput = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron consultar las releases existentes.' }
          $releaseOutput | Set-Content -Encoding utf8 $releaseJson
          $tagOutput = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/beta"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron consultar los tags del canal beta.' }
          $tagOutput | Set-Content -Encoding utf8 $tagsJson
          $channelState = node scripts/validate-beta-channel.mjs --releases-file $releaseJson --tags-file $tagsJson
          if ($LASTEXITCODE -ne 0) { throw 'El destino beta ya existe y no pertenece exclusivamente al canal de Mermaid BP.' }
          "Canal beta: $channelState"
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Ya existe una etiqueta para esta versión.' }
      - name: Descargar instalador aprobado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          LINUX_BUILD_RUN_ID: ${{ inputs.linux_build_run_id }}
        run: |
          gh run download $env:BUILD_RUN_ID -n mermaid-bp-windows -D desktop-app/src-tauri/target/release/bundle/nsis
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar el instalador revisado.' }
          gh run download $env:LINUX_BUILD_RUN_ID -n mermaid-bp-linux-updater -D desktop-app/src-tauri/target/release/bundle/deb
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar el paquete Debian revisado.' }
      - name: Publicar instalador y artefactos updater firmados
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content desktop-app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $folder = 'desktop-app/src-tauri/target/release/bundle/nsis'
          $installer = @(Get-ChildItem "$folder/*-setup.exe")
          if ($installer.Count -ne 1) { throw 'Se esperaba un instalador NSIS.' }
          $signaturePath = "$($installer[0].FullName).sig"
          if (!(Test-Path -LiteralPath $signaturePath) -or (Get-Item -LiteralPath $signaturePath).Length -eq 0) { throw 'Falta la firma minisign del instalador updater.' }
          $debFolder = 'desktop-app/src-tauri/target/release/bundle/deb'
          $linuxPackage = @(Get-ChildItem "$debFolder/*.deb")
          if ($linuxPackage.Count -ne 1 -or $linuxPackage[0].Name -notmatch "^mermaid-bp_$([regex]::Escape($tag))_amd64\.deb$") { throw 'El artefacto Linux debe ser el paquete Debian amd64 de esta versión.' }
          $linuxSignaturePath = "$($linuxPackage[0].FullName).sig"
          if (!(Test-Path -LiteralPath $linuxSignaturePath) -or (Get-Item -LiteralPath $linuxSignaturePath).Length -eq 0) { throw 'Falta la firma minisign del paquete Debian updater.' }
          $hash = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer[0].Name)" | Set-Content "$($installer[0].FullName).sha256" -Encoding utf8
          $linuxHash = (Get-FileHash $linuxPackage[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$linuxHash  $($linuxPackage[0].Name)" | Set-Content "$($linuxPackage[0].FullName).sha256" -Encoding utf8
          $manifestPath = Join-Path $folder 'latest.json'
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($installer[0].Name)"
          $linuxAssetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($linuxPackage[0].Name)"
          node scripts/create-updater-manifest.mjs --version $tag --notes-file desktop-app/RELEASE.md --artifact-url $assetUrl --signature-file $signaturePath --linux-artifact-url $linuxAssetUrl --linux-signature-file $linuxSignaturePath --output $manifestPath
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear el manifiesto firmado del canal beta.' }
          gh release create $tag $installer[0].FullName "$($installer[0].FullName).sha256" $signaturePath $linuxPackage[0].FullName "$($linuxPackage[0].FullName).sha256" $linuxSignaturePath $manifestPath --target $env:GITHUB_SHA --title $tag --prerelease --notes-file desktop-app/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la beta.' }
          $releaseJson = Join-Path $env:RUNNER_TEMP 'beta-releases.json'
          $tagsJson = Join-Path $env:RUNNER_TEMP 'beta-tags.json'
          $releaseOutput = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron volver a consultar las releases existentes.' }
          $releaseOutput | Set-Content -Encoding utf8 $releaseJson
          $tagOutput = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/beta"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron volver a consultar los tags del canal beta.' }
          $tagOutput | Set-Content -Encoding utf8 $tagsJson
          $channelState = node scripts/validate-beta-channel.mjs --releases-file $releaseJson --tags-file $tagsJson
          if ($LASTEXITCODE -ne 0) { throw 'El destino beta cambió y ya no pertenece exclusivamente al canal de Mermaid BP.' }
          if ($channelState -eq 'owned-with-manifest') {
            gh release upload beta $manifestPath --repo $env:GITHUB_REPOSITORY --clobber
          } elseif ($channelState -eq 'owned-empty') {
            gh release upload beta $manifestPath --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create beta $manifestPath --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Canal beta de Mermaid BP' --prerelease --notes-file desktop-app/RELEASE.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el manifiesto mutable del canal beta.' }
          if ($channelState -ne 'empty') {
            gh release edit beta --repo $env:GITHUB_REPOSITORY --title 'Canal beta de Mermaid BP' --notes-file desktop-app/RELEASE.md
            if ($LASTEXITCODE -ne 0) { throw 'No se pudieron actualizar las notas del canal beta.' }
          }
