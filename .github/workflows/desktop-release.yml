name: Aplicación de escritorio Windows
on:
  push:
    tags: ['*-alpha.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - run: npm test
      - run: npm run test:security
      - run: npm run desktop:build
      - run: node --test tests/desktop.test.mjs
      - name: Publicar instalador y suma SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content desktop-app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installer = Get-ChildItem desktop-app/src-tauri/target/release/bundle/nsis/*.exe
          if ($installer.Count -ne 1) { throw 'Se esperaba un instalador NSIS.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --prerelease --notes-file desktop-app/RELEASE.md
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear la release.' }
          }
          gh release upload $tag $installer.FullName "$($installer.FullName).sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el instalador.' }
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-bp-windows
          path: desktop-app/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
