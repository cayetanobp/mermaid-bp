name: Comprobaciones
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  rust-notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - run: node scripts/check-rust-third-party-notices.mjs
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run package:web
        env:
          MERMAID_BP_PLUGINS: none
      - uses: actions/upload-artifact@v4
        with:
          name: core-web-dist
          path: dist/
          if-no-files-found: error
  core-browser:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: core-web-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: env MERMAID_BP_PLUGINS=none npx playwright test --config config/playwright.config.ts tests/core-only.spec.ts
  windows:
    needs: rust-notices
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Generate a per-run CI-only Tauri updater key
        run: node scripts/prepare-ci-updater-key.mjs
      - name: Prepare CI updater public-key overlay
        shell: pwsh
        run: |
          @{ plugins = @{ updater = @{ pubkey = $env:MERMAID_BP_CI_UPDATER_PUBKEY } } } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'tauri-ci.json')
      - name: Compilar la aplicación sin empaquetar en pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: desktop-app
        run: npm exec -- tauri build --no-bundle -- --locked
      # CI-only: the updater code matches release; the feature only enables WebView2 CDP for UI automation.
      - name: Probar el updater firmado en una instalación Windows real
        id: windows-updater
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/windows-updater-e2e.mjs
      - name: Compilar updater de CI con una clave efímera en main
        if: github.event_name != 'pull_request'
        working-directory: desktop-app
        run: npm exec -- tauri build --config "$env:RUNNER_TEMP/tauri-ci.json" -- --locked
      - run: node --test tests/desktop.test.mjs
      - name: Verificar contenido del instalador
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Se esperaba un instalador NSIS.' }
          ./scripts/verify-nsis-license.ps1 -Installer $installer[0].FullName
      - name: Subir instalador firmado de validación (sin publicar)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-bp-windows-signed-validation
          path: |
            desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 3
      - name: Adjuntar diagnósticos del updater Windows si falla
        if: failure() && steps.windows-updater.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-bp-windows-updater-diagnostics
          path: ${{ runner.temp }}/mermaid-bp-windows-updater-e2e-*/*
          if-no-files-found: warn
          retention-days: 3
