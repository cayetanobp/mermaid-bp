name: Comprobaciones
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust-notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - run: node scripts/check-rust-third-party-notices.mjs
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run package:web
        env:
          MERMAID_BP_PLUGINS: none
      - uses: actions/upload-artifact@v4
        with:
          name: core-web-dist
          path: dist/
          if-no-files-found: error
  core-browser:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: core-web-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: env MERMAID_BP_PLUGINS=none npx playwright test --config config/playwright.config.ts tests/core-only.spec.ts
  windows:
    needs: rust-notices
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - run: npm run desktop:build
      - run: node --test tests/desktop.test.mjs
      - name: Verificar contenido del instalador
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Se esperaba un instalador NSIS.' }
          ./scripts/verify-nsis-license.ps1 -Installer $installer[0].FullName
