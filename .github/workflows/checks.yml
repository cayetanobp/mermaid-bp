name: Comprobaciones
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust-notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - run: node scripts/check-rust-third-party-notices.mjs
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run package:web
  windows:
    needs: rust-notices
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - name: Exigir la clave de firma antes de compilar en main
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'Falta TAURI_SIGNING_PRIVATE_KEY; no se compilará ni publicará un updater sin firma.' }
      - name: Exigir la clave de firma para PRs internos
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'Falta TAURI_SIGNING_PRIVATE_KEY para producir el artefacto firmado de validación.' }
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Compilar la aplicación sin empaquetar en pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: desktop-app
        run: npm exec -- tauri build --no-bundle
      - name: Compilar y firmar el instalador de validación sin publicar
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Compilar y firmar el updater en main
        if: github.event_name != 'pull_request'
        run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - run: node --test tests/desktop.test.mjs
      - name: Verificar contenido del instalador
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Se esperaba un instalador NSIS.' }
          ./scripts/verify-nsis-license.ps1 -Installer $installer[0].FullName
      - name: Subir instalador firmado de validación (sin publicar)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-bp-windows-signed-validation
          path: |
            desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-app/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip
            desktop-app/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip.sig
          if-no-files-found: error
          retention-days: 3
