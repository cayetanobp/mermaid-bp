[package]
name = "mermaid-bp-desktop"
version = "1.0.0-beta.1"
description = "Editor local de diagramas Mermaid"
license = "AGPL-3.0-only"
edition = "2021"

[features]
# The Windows updater E2E harness alone enables this; release builds must leave it off.
updater-e2e-cdp = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
serde_json = "1"
cap-std = "3"
base64 = "0.22"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
